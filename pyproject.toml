[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracker"
version = "0.1.0"
description = "Personal ADHD accountability time tracker"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "websockets>=12.0",
    "python-dateutil>=2.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
track = "tracker.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=tracker --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
